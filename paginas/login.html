<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-nutri">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-heart-pulse-fill me-2"></i>NutriVida</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Inicio</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card card-custom p-4 mx-auto" style="max-width: 480px;">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle fs-1 text-success"></i>
                <h3 class="fw-bold mt-2">Inicio de Sesión</h3>
                <p class="text-muted small">Seleccione su perfil de acceso</p>
            </div>
            <form onsubmit="ejecutarLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Seleccionar Perfil / Rol</label>
                    <select id="loginRol" class="form-select" required>
                        <option value="paciente">Paciente / Cliente</option>
                        <option value="medico">Nutricionista / Médico</option>
                        <option value="admin">Administrador del Sistema</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="loginCorreo" class="form-control" placeholder="correo@nutrivida.cl" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="loginClave" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-nutri w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">¿No tiene cuenta? <a href="registro.html" class="text-success fw-bold">Regístrese aquí</a></small>
            </div>
        </div>
    </main>

    <script src="../js/validaciones.js"></script>
    <script src="../js/funciones.js"></script>
</body>
</html>
