<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-nutri">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-heart-pulse-fill me-2"></i>NutriVida</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Inicio</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row card-custom g-0 overflow-hidden shadow-lg mx-auto" style="max-width: 950px;">
            <div class="col-lg-5 d-none d-lg-block">
                <img src="https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&w=700&q=80" class="h-100 w-100" style="object-fit: cover;" alt="Nutrición Saludable">
            </div>

            <div class="col-lg-7 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-nutri">Registro de Usuario</h3>
                    <p class="text-muted small">Cree su cuenta para acceder a agendamientos y fichas médicas</p>
                </div>

                <form onsubmit="ejecutarRegistro(event)">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="regNombre" class="form-control" placeholder="Ej. Camila Silva" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">RUT / Documento</label>
                            <input type="text" id="regRut" class="form-control" placeholder="Ej. 12.345.678-9" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="regCorreo" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" id="regTelefono" class="form-control" placeholder="+56 9 1234 5678" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="date" id="regFechaNac" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Género</label>
                            <select id="regGenero" class="form-select" required>
                                <option value="" disabled selected>Seleccione género...</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Otro">Otro / Prefiero no decir</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="regClave" class="form-control" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Perfil de Usuario</label>
                            <select id="regRol" class="form-select" required>
                                <option value="paciente">Paciente</option>
                                <option value="medico">Nutricionista</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-check mb-4 mt-2">
                        <input class="form-check-input" type="checkbox" id="regTerminos" required>
                        <label class="form-check-label small text-secondary" for="regTerminos">
                            He leído y acepto los <a href="#" class="text-success fw-bold">Términos de Servicio</a> y las <a href="#" class="text-success fw-bold">Políticas de Salud</a> de la Clínica NutriVida.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-nutri w-100 py-2">
                        <i class="bi bi-check-circle me-1"></i> Crear Cuenta
                    </button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">¿Ya tiene cuenta? <a href="login.html" class="text-success fw-bold">Inicie Sesión aquí</a></small>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/validaciones.js"></script>
    <script src="../js/funciones.js"></script>
</body>
</html>
