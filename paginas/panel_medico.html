<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico - NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-nutri">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-stethoscope me-2"></i>Portal Médico: Dra. María González</a>
            <a href="login.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Salir</a>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card card-custom p-4 mb-4 border-start border-success border-4">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-calendar-event me-2"></i>Mi Agenda de Hoy (Pacientes Asignados)</h5>
            <div class="table-responsive">
                <table class="table table-sm align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>10:00 hrs</td>
                            <td class="fw-bold">Camila Silva</td>
                            <td>Control Mensual</td>
                            <td><span class="badge bg-warning text-dark">Por Atender</span></td>
                            <td><button class="btn btn-sm btn-success" onclick="document.getElementById('selectPacienteMedico').value='Camila Silva'">Iniciar Atención</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-nutri mb-3"><i class="bi bi-journal-plus me-2"></i>Registrar Ficha Clínica</h5>
                    <form id="formEvaluacionMedico" onsubmit="agregarEvaluacionMedico(event)">
                        <div class="mb-3">
                            <label class="form-label">Paciente Asignado</label>
                            <input type="text" id="selectPacienteMedico" class="form-control bg-light" placeholder="Seleccione desde la agenda..." required>
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" step="0.1" id="inputPeso" class="form-control" required>
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">Talla (cm)</label>
                                <input type="number" id="inputTalla" class="form-control" required>
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">Cintura (cm)</label>
                                <input type="number" step="0.1" id="inputCintura" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Plan Alimenticio / Indicaciones</label>
                            <textarea id="inputPlanMedico" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-nutri w-100"><i class="bi bi-save me-1"></i> Guardar Ficha</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7 mb-4">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-nutri mb-3"><i class="bi bi-folder2-open me-2"></i>Historial de Mis Pacientes</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center small">
                            <thead class="table-light">
                                <tr>
                                    <th>Paciente</th>
                                    <th>Último Control</th>
                                    <th>IMC</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPacientesMedico">
                                <tr>
                                    <td class="fw-bold">Camila Silva</td>
                                    <td>15/09/2026</td>
                                    <td>25.1</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-primary" onclick="alert('Abriendo modo edición')"><i class="bi bi-pencil"></i></button>
                                        <button class="btn btn-sm btn-outline-success" onclick="alert('Visualizando historial completo en PDF')"><i class="bi bi-eye"></i> Historial</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/funciones.js"></script>
</body>
</html>
