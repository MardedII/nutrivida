# Perfil de desarrollo con datos ficticios, separado de la base habitual.
spring.datasource.url=jdbc:h2:file:./data/demo/usuariosdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# SOLO DESARROLLO LOCAL: valores de prueba compartidos por los cinco servicios.
# No se deben usar para despliegues ni datos reales.
server.address=127.0.0.1
app.jwt.secret=${JWT_SECRET:nutrivida-demo-local-jwt-no-usar-en-produccion-2026}
app.internal.secret=${INTERNAL_SECRET:nutrivida-demo-local-interno-no-usar-en-produccion-2026}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
