server.port=8081
spring.application.name=ms-pacientes
spring.datasource.url=jdbc:h2:file:./data/pacientesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
server.error.include-message=always

servicios.usuarios.url=${USUARIOS_URL:http://localhost:8085}

server.address=${SERVER_ADDRESS:127.0.0.1}
app.jwt.secret=${JWT_SECRET}
app.internal.secret=${INTERNAL_SECRET}

# No cargar datos ficticios fuera del perfil demo.
spring.sql.init.mode=never

# Para aprendizaje local: demo se activa si no se elige otro perfil.
# En cualquier perfil no demo se requieren los secretos de entorno.
spring.profiles.default=demo
